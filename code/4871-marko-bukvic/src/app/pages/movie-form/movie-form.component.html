<form [formGroup]="form" (ngSubmit)="submit()" class="form">
    <label>ID
      <input type="text" [value]="idText" readonly>
    </label>
  
    <label>Title *
      <input type="text" formControlName="title">
      @if (invalid('title')) { <span class="error">Title is required</span> }
    </label>
  
    <label>Year *
      <input type="number" formControlName="year">
      @if (invalid('year')) { <span class="error">Enter a valid year (1888-2100)</span> }
    </label>
  
    <label>Plot
      <textarea formControlName="plot" rows="3"></textarea>
    </label>
  
    <label>Director *
      <input type="text" formControlName="director">
      @if (invalid('director')) { <span class="error">Director is required</span> }
    </label>
  
    <label>Genre (Ctrl + click to select several)
      <select formControlName="genres" multiple size="6">
        @for (genre of genres; track genre) { <option [value]="genre">{{ genre }}</option> }
      </select>
    </label>
  
    <label>Rating
      <input type="number" formControlName="rating" step="0.1">
      @if (invalid('rating')) { <span class="error">Rating must be 0-10</span> }
    </label>
  
    <fieldset formArrayName="oscars">
      <legend>Oscars</legend>
      @for (row of oscars.controls; track row; let i = $index) {
        <div [formGroupName]="i" class="oscar-row">
          <input formControlName="type" placeholder="Type, e.g. Best Picture">
          <input formControlName="recipient" placeholder="Recipient">
          <button type="button" (click)="removeOscar(i)">Remove</button>
        </div>
      }
      <button type="button" (click)="addOscar()">Add oscar</button>
    </fieldset>
  
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
  </form>
